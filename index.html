<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPPG KOTA SERANG SERANG SERANG 2 - Multi-Media Display Manual List</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #001f28;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
      height: 100vh;
      width: 100vw;
    }

    /* Layout Utama 3 Tampilan Layar */
    .screen-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      background: linear-gradient(135deg, #70c1b3, #87ceeb, #5fa89f);
    }

    .screen-container.hidden-screen {
      display: none !important;
    }

    .screen {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: rgba(0, 0, 0, 0.25);
      border-right: 3px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .screen:last-child {
      border-right: none;
    }

    /* Penataan Elemen Media */
    .media-element {
      max-width: 96%;
      max-height: 96%;
      object-fit: contain;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      opacity: 0;
      transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .media-element.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Banner Overlay Aktivasi Suara */
    #sound-overlay {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #005f73;
      border: 2px solid #e0fbfc;
      border-radius: 30px;
      padding: 12px 30px;
      z-index: 100001;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
      animation: bounceOverlay 2s infinite;
    }

    #sound-overlay span {
      font-size: 1rem;
      font-weight: 700;
      color: #e0fbfc;
    }

    /* STAGE FULLSCREEN OVERLAY */
    .fullscreen-stage-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('logo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #001f28; 
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      z-index: 99990;
    }

    .fullscreen-stage-overlay.show {
      display: flex !important;
      opacity: 1 !important;
    }

    /* TAHAP 1: MOTIVASI */
    #fullscreen-quote-screen {
      z-index: 99991;
      text-align: center;
      padding: 40px;
    }

    #fullscreen-quote-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 31, 40, 0.90);
      z-index: 1;
    }

    .quote-content-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 90%;
    }

    .sppg-title {
      font-size: 3.5rem;
      font-weight: 900;
      color: #94d2bd;
      letter-spacing: 5px;
      margin-bottom: 30px;
      text-shadow: 0 0 25px rgba(148, 210, 189, 0.8);
    }

    .quote-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 50px 70px;
      border-radius: 30px;
      border: 2px solid rgba(224, 251, 252, 0.4);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      max-width: 1100px;
    }

    .quote-text {
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .quote-date {
      font-size: 1.4rem;
      font-weight: 600;
      color: #e0fbfc;
      letter-spacing: 4px;
      background: rgba(0, 95, 115, 0.9);
      padding: 8px 24px;
      border-radius: 20px;
      display: inline-block;
    }

    /* TAHAP 2: VIDEO FULLSCREEN */
    #fullscreen-video-overlay {
      z-index: 99992;
      background: #000000 !important;
    }

    #fullscreen-video-overlay video {
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      position: relative;
      z-index: 2;
    }

    /* TAHAP 3: GAMBAR FULLSCREEN */
    #fullscreen-image-overlay {
      z-index: 99993;
    }

    #fullscreen-image-overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 31, 40, 0.90);
      z-index: 1;
    }

    #fullscreen-image-overlay img {
      width: 90vw;
      height: 90vh;
      object-fit: contain;
      position: relative;
      z-index: 2;
      border-radius: 16px;
    }

    /* TAHAP 4 & 5: GALERI 20 KOTAK FOTO */
    #fullscreen-grid-overlay {
      z-index: 99994;
      padding: 20px;
      justify-content: flex-start;
    }

    #fullscreen-grid-overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 31, 40, 0.92);
      z-index: 1;
    }

    .grid-header-title {
      position: relative;
      z-index: 2;
      font-size: 2.2rem;
      font-weight: 900;
      color: #e0fbfc;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 15px;
      text-align: center;
    }

    .photo-grid-container {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      width: 95vw;
      height: 82vh;
    }

    .photo-card {
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(224, 251, 252, 0.3);
      border-radius: 10px;
      overflow: hidden;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes bounceOverlay {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -8px); }
    }
  </style>
</head>
<body>

  <!-- BANNER AKTIVASI SUARA -->
  <div id="sound-overlay" onclick="enableAudio()">
    <span>KLIK DI SINI UNTUK AKTIFKAN SUARA MULTIMEDIA</span>
  </div>

  <!-- CONTAINER UTAMA 3 LAYAR -->
  <div class="screen-container" id="mainContainer">
    <div class="screen" id="screen1"></div>
    <div class="screen" id="screen2">
      <video id="normalVideoPlayer" class="media-element active" playsinline muted onerror="handleNormalVideoError()"></video>
    </div>
    <div class="screen" id="screen3"></div>
  </div>

  <!-- TAHAP 1: MOTIVASI -->
  <div id="fullscreen-quote-screen" class="fullscreen-stage-overlay">
    <div class="quote-content-wrapper">
      <h1 class="sppg-title">SPPG KOTA SERANG SERANG 2</h1>
      <div class="quote-box">
        <h2 class="quote-text" id="dailyQuote">"Memuat kata-kata motivasi..."</h2>
        <p class="quote-date" id="currentDate"></p>
      </div>
    </div>
  </div>

  <!-- TAHAP 2: VIDEO FULLSCREEN -->
  <div id="fullscreen-video-overlay" class="fullscreen-stage-overlay">
    <video id="fullVideoPlayer" playsinline muted></video>
  </div>

  <!-- TAHAP 3: GAMBAR FULLSCREEN -->
  <div id="fullscreen-image-overlay" class="fullscreen-stage-overlay">
    <img id="fullImagePlayer" src="STR1.jpg" alt="Gambar Fullscreen" onerror="this.src='gb1.jpeg'">
  </div>

  <!-- TAHAP 4 & 5: GALERI 20 FOTO -->
  <div id="fullscreen-grid-overlay" class="fullscreen-stage-overlay">
    <h1 class="grid-header-title" id="gridHeaderTitle">DOKUMENTASI SPPG KOTA SERANG SERANG SERANG 2</h1>
    <div class="photo-grid-container" id="gridContainer"></div>
  </div>

  

  <script>
    // Auto Refresh Halaman Otomatis Setiap 10 Menit (600.000 ms)
// Sesuaikan angkanya dengan total durasi 1 siklus tayangan Anda
setInterval(() => {
  console.log("Melakukan auto-refresh halaman untuk memperbarui daftar media...");
  window.location.reload();
}, 300000); // 300000 ms = 5 menit

    // DURASI WAKTU TAMPILAN (Milidetik)
    const IMAGE_DISPLAY_TIME = 5000;       // Durasi slide foto Layar 1 & 3 (5 Detik)
    const QUOTE_DISPLAY_TIME = 15000;      // Durasi Motivasi (15 Detik)
    const FULL_IMAGE_DISPLAY_TIME = 10000; // Durasi Foto Fullscreen STR1.jpg (10 Detik)
    const GRID_DISPLAY_TIME = 15000;       // Durasi Galeri 20 Foto (15 Detik)

    // =========================================================================
    // DOKUMEN ISI MANUAL NAMA FILE MEDIA DI SINI
    // =========================================================================

    // 1. Foto untuk Layar Samping (Layar 1 & 3)
    let sidePhotosList = [
      'gb1.jpeg',
      'gb2.jpeg',
      'gb3.jpeg',
      'gb4.jpeg',
      'gb5.jpeg',
      'gb6.jpeg'
    ];

    // 2. Video Normal untuk Layar Tengah (Layar 2 - Bebas Tambah Banyak Video)
    let normalVideosList = [
      '1.mp4',
      '2.mp4',
      '3.mp4',
      '4.mp4',
      '5.mp4',
      '6.mp4'
    ];

    // 3. Video Fullscreen (Tahap 2)
    let fullVideosList = [
      'videofull1.mp4',
      'videofull2.mp4',
      'videofull3.mp4',
      'videofull4.mp4',

    ];

    // 4. Foto Galeri Dapur (20 Kotak Foto - Tahap 4)
    let dapurPhotosList = [
      'dpr1.jpeg', 'dpr2.jpeg', 'dpr3.jpeg', 'dpr4.jpeg', 'dpr5.jpeg',
      'dpr6.jpeg', 'dpr7.jpeg', 'dpr8.jpeg', 'dpr9.jpeg', 'dpr10.jpeg',
      'dpr11.jpeg', 'dpr12.jpeg', 'dpr13.jpeg', 'dpr14.jpeg', 'dpr15.jpeg',
      'dpr16.jpeg', 'dpr17.jpeg', 'dpr18.jpeg', 'dpr19.jpeg', 'dpr20.jpeg'
    ];

    // 5. Foto Galeri Distribusi (20 Kotak Foto - Tahap 5)
    let distribusiPhotosList = [
      '1.jpeg', '2.jpeg', '3.jpeg', '4.jpeg', '5.jpeg',
      '6.jpeg', '7.jpeg', '8.jpeg', '9.jpeg', '10.jpeg',
      '11.jpeg', '12.jpeg', '13.jpeg', '14.jpeg', '15.jpeg',
      '16.jpeg', '17.jpeg', '18.jpeg', '19.jpeg', '20.jpeg'
    ];

    // =========================================================================

    let currentNormalVideoIdx = 0; 
    let currentFullVideoIdx = 0;
    let isAudioEnabled = false;

    // Memasang elemen HTML Foto Layar 1 & 3
    function renderSideScreens() {
      const s1 = document.getElementById('screen1');
      const s3 = document.getElementById('screen3');

      s1.innerHTML = '';
      s3.innerHTML = '';

      sidePhotosList.forEach((filename, idx) => {
        const activeClass = idx === 0 ? 'active' : '';
        s1.innerHTML += `<img src="${filename}" class="media-element ${activeClass}" onerror="this.style.display='none'">`;
        s3.innerHTML += `<img src="${filename}" class="media-element ${activeClass}" onerror="this.style.display='none'">`;
      });
    }

    const subjects = ["Kesuksesan sejati", "Impian besar Anda", "Keberanian tanpa batas", "Setiap langkah kecil hari ini", "Komitmen dan konsistensi"];
    const actions = ["akan selalu membuka jalan bagi", "merupakan kunci utama untuk membuka", "selalu melahirkan hasil terbaik dalam"];
    const targets = ["masa depan yang jauh lebih cemerlang.", "pencapaian prestasi yang tak terhitung jumlahnya.", "kemenangan besar yang membanggakan."];

    function generateInfiniteQuote() {
      const s = subjects[Math.floor(Math.random() * subjects.length)];
      const a = actions[Math.floor(Math.random() * actions.length)];
      const t = targets[Math.floor(Math.random() * targets.length)];
      return `${s} ${a} ${t}`;
    }

    function hideAllStages() {
      const overlays = document.querySelectorAll('.fullscreen-stage-overlay');
      overlays.forEach(overlay => {
        overlay.classList.remove('show');
        overlay.style.display = 'none';
      });
    }

    function showStage(element) {
      const mainContainer = document.getElementById('mainContainer');
      if (mainContainer) mainContainer.classList.add('hidden-screen');
      hideAllStages(); 
      element.style.display = 'flex';
      void element.offsetWidth; 
      element.classList.add('show');
    }

    function restoreMainContainer() {
      hideAllStages();
      const mainContainer = document.getElementById('mainContainer');
      if (mainContainer) mainContainer.classList.remove('hidden-screen');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSideScreens();
      setupImageSlideshow('screen1', IMAGE_DISPLAY_TIME);
      setupImageSlideshow('screen3', IMAGE_DISPLAY_TIME);

      const normalPlayer = document.getElementById('normalVideoPlayer');
      normalPlayer.addEventListener('ended', onNormalVideoEnded);

      const fullPlayer = document.getElementById('fullVideoPlayer');
      fullPlayer.addEventListener('ended', handleFullVideoNext);

      playNormalVideoSequence();
    });

    function enableAudio() {
      if (isAudioEnabled) return;
      isAudioEnabled = true;

      const overlay = document.getElementById('sound-overlay');
      if (overlay) overlay.style.display = 'none';

      const normalPlayer = document.getElementById('normalVideoPlayer');
      const fullPlayer = document.getElementById('fullVideoPlayer');

      normalPlayer.muted = false;
      fullPlayer.muted = false;

      normalPlayer.play().catch(e => console.log(e));
    }

    function setupImageSlideshow(screenId, intervalMs) {
      const screen = document.getElementById(screenId);
      let currentIndex = 0;

      return setInterval(() => {
        const validImages = Array.from(screen.querySelectorAll('img')).filter(img => img.style.display !== 'none');
        if (validImages.length <= 1) return;

        validImages[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % validImages.length;
        validImages[currentIndex].classList.add('active');
      }, intervalMs);
    }

    function playNormalVideoSequence() {
      restoreMainContainer();

      const normalPlayer = document.getElementById('normalVideoPlayer');
      const targetSrc = normalVideosList[currentNormalVideoIdx] || '1.mp4';

      normalPlayer.src = targetSrc;
      normalPlayer.muted = !isAudioEnabled;

      normalPlayer.play().catch(e => {
        handleNormalVideoError();
      });
    }

    function onNormalVideoEnded() {
      currentNormalVideoIdx++;
      if (currentNormalVideoIdx >= normalVideosList.length) {
        currentNormalVideoIdx = 0; 
        showDailyQuoteScreen();    
      } else {
        playNormalVideoSequence(); 
      }
    }

    function handleNormalVideoError() {
      currentNormalVideoIdx++;
      if (currentNormalVideoIdx >= normalVideosList.length) {
        currentNormalVideoIdx = 0;
      }
      playNormalVideoSequence();
    }

    function showDailyQuoteScreen() {
      const normalPlayer = document.getElementById('normalVideoPlayer');
      normalPlayer.pause();

      const newQuote = generateInfiniteQuote();
      document.getElementById('dailyQuote').innerText = `"${newQuote}"`;
      
      const today = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('currentDate').innerText = today.toLocaleDateString('id-ID', options);

      showStage(document.getElementById('fullscreen-quote-screen'));
      speakQuote(newQuote);

      setTimeout(() => {
        closeQuoteAndPlayFullVideo();
      }, QUOTE_DISPLAY_TIME);
    }

    function speakQuote(text) {
      if ('speechSynthesis' in window && isAudioEnabled) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function closeQuoteAndPlayFullVideo() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      currentFullVideoIdx = 0;
      playDedicatedFullVideo();
    }

    function playDedicatedFullVideo() {
      if (!fullVideosList || fullVideosList.length === 0) {
        playDedicatedFullImage();
        return;
      }

      const fullOverlay = document.getElementById('fullscreen-video-overlay');
      const fullPlayer = document.getElementById('fullVideoPlayer');

      const targetVideoSrc = fullVideosList[currentFullVideoIdx];
      fullPlayer.src = targetVideoSrc;
      fullPlayer.muted = !isAudioEnabled;

      showStage(fullOverlay);

      fullPlayer.play().catch(e => {
        handleFullVideoNext();
      });
    }

    function handleFullVideoNext() {
      currentFullVideoIdx++;

      if (currentFullVideoIdx < fullVideosList.length) {
        playDedicatedFullVideo();
      } else {
        const fullPlayer = document.getElementById('fullVideoPlayer');
        fullPlayer.pause();
        playDedicatedFullImage(); 
      }
    }

    function playDedicatedFullImage() {
      const imgOverlay = document.getElementById('fullscreen-image-overlay');
      const imgPlayer = document.getElementById('fullImagePlayer');
      imgPlayer.src = 'STR1.jpg';
      showStage(imgOverlay);

      setTimeout(() => {
        playDapurGridPhotos();
      }, FULL_IMAGE_DISPLAY_TIME);
    }

    function playDapurGridPhotos() {
      renderPhotoGrid('DOKUMENTASI DAPUR SPPG KOTA SERANG SERANG SERANG 2', dapurPhotosList);
      showStage(document.getElementById('fullscreen-grid-overlay'));

      setTimeout(() => {
        playDistribusiGridPhotos();
      }, GRID_DISPLAY_TIME);
    }

    function playDistribusiGridPhotos() {
      renderPhotoGrid('DOKUMENTASI DISTRIBUSI PENERIMA MANFAAT', distribusiPhotosList);
      showStage(document.getElementById('fullscreen-grid-overlay'));

      setTimeout(() => {
        playNormalVideoSequence();
      }, GRID_DISPLAY_TIME);
    }

    function renderPhotoGrid(titleText, photosArray) {
      document.getElementById('gridHeaderTitle').innerText = titleText;
      const gridContainer = document.getElementById('gridContainer');

      gridContainer.innerHTML = '';
      photosArray.slice(0, 20).forEach((photoSrc) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `<img src="${photoSrc}" onerror="this.src='gb1.jpeg'">`;
        gridContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
